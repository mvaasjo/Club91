// Multiply ingredient amounts by guest count where it's a clean oz value.
function scaleAmount(amount, multiplier) {
  if (!amount || multiplier === 1) return amount;
  const ozMatch = amount.match(/^([\d.]+)\s*oz$/i);
  if (ozMatch) {
    const total = parseFloat(ozMatch[1]) * multiplier;
    return `${total % 1 === 0 ? total : total.toFixed(1)} oz`;
  }
  // For ranges like "3–4 oz", scale the range
  const rangeMatch = amount.match(/^([\d.]+)\s*[–-]\s*([\d.]+)\s*oz$/i);
  if (rangeMatch) {
    const low = parseFloat(rangeMatch[1]) * multiplier;
    const high = parseFloat(rangeMatch[2]) * multiplier;
    return `${low}–${high} oz`;
  }
  // For other amounts (dashes, "1 sugar cube"), append the multiplier
  return `${amount} × ${multiplier}`;
}

function finishTheNight() {
  const m = state.host.menu;
  if (!m) return;
  const today = new Date().toISOString();
  const nightId = `night-${Date.now()}`;
  // Save a special "night" entry to the journal
  state.journal[nightId] = {
    rating: 5,
    notes: `Hosted ${state.host.guests} guests · ${m.drinks.map(d => d.cocktail.name).join(' → ')}`,
    cocktailId: nightId,
    cocktailName: `Cocktail night (${m.drinks.length} courses)`,
    lastMade: today,
    firstMade: today,
    isNight: true
  };
  saveJournal();
  // Reset the host state
  state.host.menu = null;
  state.host.walkIndex = null;
  alert(`Night logged. ${m.drinks.length} drinks served. Drink water.`);
  state.view = 'journal';
  render();
}

function renderJournal() {
  // Add a sub-state for journal mode if not present
  if (!state.journalMode) state.journalMode = 'log';

  // Flatten all journal entries: each cocktail key may now contain an array of makings.
  // Cocktail-night entries (isNight: true) are stored as singleton objects under their own keys.
  const allEntries = [];
  Object.entries(state.journal).forEach(([key, val]) => {
    if (Array.isArray(val)) {
      val.forEach(e => allEntries.push(e));
    } else if (val && val.rating) {
      // Singleton entry (typically cocktail-night or unmigrated)
      allEntries.push(val);
    }
  });
  // Filter to entries with a rating, sort by madeAt (newest first)
  const entries = allEntries
    .filter(e => e && e.rating)
    .sort((a, b) => new Date(b.madeAt || b.lastMade || 0) - new Date(a.madeAt || a.lastMade || 0));

  const drinkEntries = entries.filter(e => !e.isNight);
  const nightEntries = entries.filter(e => e.isNight);
  const totalMakings = drinkEntries.length;
  const avgRating = drinkEntries.length ? (drinkEntries.reduce((s, e) => s + e.rating, 0) / drinkEntries.length).toFixed(1) : '—';

  view.innerHTML = `
    <div class="tab-content">
      <div class="section-eyebrow">your record</div>
      <h2 class="section-title">Journal</h2>
      <p class="section-sub">${totalMakings} making${totalMakings === 1 ? '' : 's'} logged${totalMakings > 0 ? ` · average ${avgRating} stars` : ''}${nightEntries.length > 0 ? ` · ${nightEntries.length} night${nightEntries.length === 1 ? '' : 's'} hosted` : ''}</p>

      <div class="journal-toggle">
        <button class="journal-toggle-btn ${state.journalMode === 'log' ? 'active' : ''}" data-mode="log">Log</button>
        <button class="journal-toggle-btn ${state.journalMode === 'passport' ? 'active' : ''}" data-mode="passport">Passport</button>
      </div>

      ${state.journalMode === 'passport' ? renderPassportContent() : renderLogContent(entries)}
    </div>
  `;

  view.querySelectorAll('[data-mode]').forEach(b => {
    b.addEventListener('click', () => {
      state.journalMode = b.dataset.mode;
      render();
    });
  });
  view.querySelectorAll('[data-cocktail]').forEach(el => {
    el.addEventListener('click', () => { state.selectedCocktail = el.dataset.cocktail; render(); });
  });
}

function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[d.getMonth()]} ${d.getDate()}`;
}

function renderLearn() {
  // Compute progress on each path
  const pathsWithProgress = CURRICULUM.map(p => {
    const completed = p.drinks.filter(id => isCocktailMade(id)).length;
    const total = p.drinks.length;
    const pct = total > 0 ? Math.round((completed / total) * 100) : 0;
    const next = p.drinks.find(id => !isCocktailMade(id));
    const nextCocktail = next ? COCKTAILS.find(c => c.id === next) : null;

    // How many path drinks are MAKEABLE NOW with current inventory (incl. citrus)
    const makeableNow = p.drinks.filter(id => {
      const cocktail = COCKTAILS.find(c => c.id === id);
      return cocktail && cocktailStatus(cocktail).makeable;
    }).length;
    // How many of the *not-yet-completed* drinks are makeable right now?
    const remainingMakeable = p.drinks.filter(id => {
      if (isCocktailMade(id)) return false; // already done
      const cocktail = COCKTAILS.find(c => c.id === id);
      return cocktail && cocktailStatus(cocktail).makeable;
    }).length;

    return { ...p, completed, total, pct, nextCocktail, makeableNow, remainingMakeable };
  });

  // Sort:
  //  1. In-progress with at least one makeable drink → top (actionable)
  //  2. Untouched with makeable drinks
  //  3. In-progress but nothing makeable
  //  4. Untouched with nothing makeable
  //  5. Completed (bottom)
  pathsWithProgress.sort((a, b) => {
    const score = (p) => {
      if (p.completed === p.total) return 5;
      if (p.completed > 0 && p.remainingMakeable > 0) return 1;
      if (p.completed === 0 && p.remainingMakeable > 0) return 2;
      if (p.completed > 0) return 3;
      return 4;
    };
    return score(a) - score(b);
  });

  view.innerHTML = `
    <div class="tab-content">
      <div class="section-eyebrow">your education</div>
      <h2 class="section-title">Curriculum</h2>
      <p class="section-sub">Curated learning paths through the cocktail library. Make and rate every drink in a path to graduate.</p>

      <div class="path-list">
        ${pathsWithProgress.map(p => `
          <div class="path-card ${p.completed === p.total ? 'path-complete' : ''} ${p.remainingMakeable > 0 && p.completed < p.total ? 'path-actionable' : ''}" data-path="${p.id}">
            <div class="path-card-header">
              <div>
                <div class="path-card-eyebrow">${escapeHtml(p.difficulty)}</div>
                <h3 class="path-card-name">${escapeHtml(p.name)}</h3>
                <p class="path-card-subtitle">${escapeHtml(p.subtitle)}</p>
              </div>
              ${p.completed === p.total ? '<div class="path-badge">✓</div>' : ''}
            </div>
            <div class="path-progress-row">
              <div class="path-progress-bar">
                <div class="path-progress-fill" style="width: ${p.pct}%"></div>
              </div>
              <div class="path-progress-text">${p.completed} / ${p.total}</div>
            </div>
            ${p.completed === p.total ? `
              <div class="path-next path-next-done">
                <span>Path complete · drink well</span>
              </div>
            ` : p.remainingMakeable > 0 ? `
              <div class="path-makeable-row">
                <span class="path-makeable-pill">${p.remainingMakeable} ready to make tonight</span>
                ${p.nextCocktail ? `<span class="path-next-name-inline">Next: ${escapeHtml(p.nextCocktail.name)}</span>` : ''}
              </div>
            ` : p.nextCocktail ? `
              <div class="path-next">
                <span class="path-next-label">Next:</span>
                <span class="path-next-name">${escapeHtml(p.nextCocktail.name)}</span>
                <span class="path-next-need">— need ingredients</span>
              </div>
            ` : ''}
          </div>
        `).join('')}
      </div>

      <div class="section-eyebrow" style="margin-top: 32px;">cocktail families</div>
      <h2 class="section-title">Families</h2>
      <p class="section-sub">Almost every cocktail descends from a handful of templates. Learn the families and you can improvise anything.</p>

      ${FAMILIES.map(f => `
        <div class="learn-family" data-family="${f.id}">
          <h3 class="learn-family-name">${escapeHtml(f.name)}</h3>
          <p class="learn-family-tag">${escapeHtml(f.tag)}</p>
          <p class="learn-family-desc">${escapeHtml(f.desc)}</p>
          <div class="learn-family-members">${f.members.join(' · ')}</div>
        </div>
      `).join('')}
    </div>
  `;

  view.querySelectorAll('[data-path]').forEach(el => {
    el.addEventListener('click', () => { state.selectedPath = el.dataset.path; render(); });
  });
  view.querySelectorAll('[data-family]').forEach(el => {
    el.addEventListener('click', () => { state.selectedFamily = el.dataset.family; render(); });
  });
}

    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/json';
    input.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const data = JSON.parse(ev.target.result);
          if (data.inventory) state.inventory = data.inventory;
          if (data.journal) state.journal = data.journal;
          if (data.bottleNotes) state.bottleNotes = data.bottleNotes;
          saveInventory();
          saveJournal();
          saveBottleNotes();
          render();
          alert('Data imported successfully.');
        } catch (err) {
          alert('Could not parse that file.');
        }
      };
      reader.readAsText(file);
    };
    input.click();
  });

  document.getElementById('reset-inv-btn').addEventListener('click', () => {
    if (confirm('Reset your inventory to the original default? Your journal will not be affected.')) {
      state.inventory = JSON.parse(JSON.stringify(DEFAULT_INVENTORY));
      saveInventory();
      render();
    }
  });

  document.getElementById('clear-btn').addEventListener('click', () => {
    if (confirm('Clear all inventory AND journal entries? This cannot be undone.')) {
      state.inventory = JSON.parse(JSON.stringify(DEFAULT_INVENTORY));
      state.journal = {};
      saveInventory();
      saveJournal();
      render();
    }
  });
}

// ============================================================================
// EVENTS
// ============================================================================

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    state.view = t.dataset.tab;
    state.selectedCocktail = null;
    state.selectedFamily = null;
    state.selectedSpirit = null;
    state.selectedPath = null;
    state.filter = 'all';
    render();
  });
});

// initial render
render();

// Pre-populate journal with the drinks we've already discussed
(function initJournalIfEmpty() {
  if (Object.keys(state.journal).length === 0) {
    const today = new Date().toISOString();
    state.journal['whiskey-sour'] = [{
      entryId: today + '|whiskey-sour|seed',
      rating: 4, notes: 'Used 1 oz lemon, 1 oz simple. Better balanced for me than the snappier classic ratio.',
      cocktailId: 'whiskey-sour', cocktailName: 'Whiskey Sour',
      bottlesUsed: ['Jameson'],
      madeAt: today, lastMade: today, firstMade: today
    }];
    state.journal['old-fashioned'] = [{
      entryId: today + '|old-fashioned|seed',
      rating: 4, notes: 'Made with Jack Daniel\'s. Liked it.',
      cocktailId: 'old-fashioned', cocktailName: 'Old Fashioned',
      bottlesUsed: ['Jack Daniel\'s'],
      madeAt: today, lastMade: today, firstMade: today
    }];
    saveJournal();
    render();
  }
})();
</script>
