<title>Club 91 — A Cocktail Journal</title>

<style>
  :root {
    /* Paper tones — cooler, more bone/parchment than cream */
    --paper: #f3eee2;
    --paper-deep: #e8e0cd;
    --paper-soft: #f8f3e7;
    --paper-card: #fbf7ed;

    /* Ink tones — warm near-blacks */
    --ink: #1c130d;
    --ink-soft: #3a2a1d;
    --ink-muted: #6b5947;
    --ink-faint: #a99882;

    /* Accents — refined */
    --oxblood: #732229;
    --oxblood-deep: #4a1418;
    --oxblood-soft: rgba(115, 34, 41, 0.08);
    --brass: #9a7a36;
    --brass-light: #c0a060;
    --brass-deep: #6f5722;
    --brass-soft: rgba(154, 122, 54, 0.08);

    /* Steel — the heraldic blue */
    --steel: rgb(70, 130, 180);
    --steel-deep: rgb(48, 96, 138);
    --steel-darker: rgb(34, 70, 105);
    --steel-soft: rgba(70, 130, 180, 0.08);
    --steel-muted: rgba(70, 130, 180, 0.18);

    /* Lines — subtler than before */
    --line: rgba(28, 19, 13, 0.08);
    --line-strong: rgba(28, 19, 13, 0.18);
    --line-brass: rgba(154, 122, 54, 0.3);

    /* Shadows — for depth */
    --shadow-sm: 0 1px 2px rgba(28, 19, 13, 0.04);
    --shadow-md: 0 2px 8px rgba(28, 19, 13, 0.06);
    --shadow-lg: 0 8px 24px rgba(28, 19, 13, 0.08);

    /* Type families */
    --display: 'Playfair Display', 'Garamond', Georgia, serif;
    --serif: 'Cormorant Garamond', 'Garamond', Georgia, serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

    /* Spacing scale */
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 20px;
    --space-6: 24px;
    --space-8: 32px;

    /* Radii — disciplined */
    --r-sm: 2px;
    --r-md: 4px;
    --r-lg: 6px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
    padding-bottom: env(safe-area-inset-bottom);
    text-rendering: optimizeLegibility;
  }

  /* Subtle paper grain — fixed so it doesn't scroll */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(ellipse at 15% 20%, rgba(115, 34, 41, 0.018) 0%, transparent 40%),
      radial-gradient(ellipse at 85% 75%, rgba(154, 122, 54, 0.022) 0%, transparent 45%),
      radial-gradient(ellipse at 50% 50%, rgba(70, 130, 180, 0.015) 0%, transparent 60%),
      radial-gradient(circle at 50% 50%, transparent 0%, rgba(28, 19, 13, 0.015) 100%);
    z-index: 1;
  }

  .app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    position: relative;
    z-index: 2;
    padding-bottom: 88px;
  }

  /* HEADER */
  .header {
    padding: 14px 20px 12px;
    text-align: center;
    border-bottom: 0.5px solid var(--line-strong);
    position: sticky;
    top: 0;
    background: var(--paper);
    z-index: 10;
    padding-top: calc(14px + env(safe-area-inset-top));
  }
  .header-mark {
    font-family: var(--sans);
    font-size: 8.5px;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: var(--brass-deep);
    font-weight: 600;
    margin-bottom: 4px;
    opacity: 0.85;
  }
  .header-title {
    font-family: var(--display);
    font-size: 32px;
    font-weight: 600;
    font-style: italic;
    margin: 0;
    line-height: 1;
    color: var(--ink);
    letter-spacing: -0.01em;
  }
  .header-tagline {
    font-family: var(--serif);
    font-size: 11.5px;
    font-style: italic;
    color: var(--ink-muted);
    margin-top: 5px;
    letter-spacing: 0.02em;
  }
  .header-rule {
    width: 28px;
    height: 0.5px;
    background: var(--brass);
    margin: 9px auto 0;
    opacity: 0.7;
  }

  /* TAB CONTENT */
  .tab-content {
    padding: 22px 18px 24px;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* SECTION HEADING */
  .section-eyebrow {
    font-family: var(--sans);
    font-size: 9px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--brass-deep);
    font-weight: 600;
    margin-bottom: 6px;
  }
  .section-title {
    font-family: var(--display);
    font-size: 26px;
    font-weight: 600;
    margin: 0 0 6px;
    line-height: 1.1;
    color: var(--ink);
    letter-spacing: -0.005em;
  }
  .section-sub {
    font-family: var(--serif);
    font-size: 15px;
    color: var(--ink-muted);
    margin: 0 0 24px;
    line-height: 1.45;
    font-style: italic;
  }

  /* COCKTAIL CARDS */
  .cocktail-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .cocktail-card {
    background: var(--paper-card);
    border: 0.5px solid var(--line);
    border-radius: var(--r-md);
    padding: 16px 18px 14px;
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    position: relative;
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }
  .cocktail-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 2px;
    background: var(--brass);
    opacity: 0;
    transition: opacity 0.2s;
  }
  .cocktail-card.makeable::before { opacity: 1; }
  .cocktail-card.makeable {
    border-color: var(--line-brass);
  }
  .cocktail-card:hover { box-shadow: var(--shadow-md); }
  .cocktail-card:active {
    transform: scale(0.995);
    box-shadow: var(--shadow-sm);
  }

  .cocktail-name {
    font-family: var(--display);
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 3px;
    color: var(--ink);
    line-height: 1.1;
    letter-spacing: -0.005em;
  }
  .cocktail-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--sans);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 500;
    margin-bottom: 8px;
  }
  .cocktail-meta-dot {
    width: 2px; height: 2px; border-radius: 50%;
    background: var(--ink-faint);
  }
  .cocktail-desc {
    font-family: var(--serif);
    font-size: 14px;
    color: var(--ink-soft);
    line-height: 1.45;
    margin: 0;
    font-style: italic;
  }
  .cocktail-tags {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .tag {
    font-family: var(--sans);
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: var(--r-sm);
    font-weight: 600;
  }
  .tag-makeable {
    background: var(--brass-soft);
    color: var(--brass-deep);
    border: 0.5px solid var(--line-brass);
  }
  .tag-missing {
    background: transparent;
    color: var(--ink-faint);
    border: 0.5px solid var(--line-strong);
  }
  .tag-family {
    background: var(--paper-deep);
    color: var(--ink-soft);
  }
  .tag-rated {
    background: var(--oxblood-soft);
    color: var(--oxblood);
    border: 0.5px solid rgba(115, 34, 41, 0.2);
  }

  /* DETAIL VIEW */
  .detail {
    padding: 0 0 24px;
    animation: fadeIn 0.3s ease;
  }
  .detail-back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    font-family: var(--sans);
    font-size: 12px;
    color: var(--ink-muted);
    padding: 14px 20px;
    cursor: pointer;
    letter-spacing: 0.04em;
    font-weight: 500;
  }
  .detail-back:active { color: var(--ink); }
  .detail-header {
    padding: 0 24px 24px;
    border-bottom: 0.5px solid var(--line);
    margin-bottom: 28px;
  }
  .detail-eyebrow {
    font-family: var(--sans);
    font-size: 9px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--brass-deep);
    font-weight: 600;
    margin-bottom: 10px;
  }
  .detail-name {
    font-family: var(--display);
    font-size: 40px;
    font-weight: 600;
    font-style: italic;
    line-height: 1;
    margin: 0 0 10px;
    letter-spacing: -0.01em;
  }
  .detail-tagline {
    font-family: var(--serif);
    font-size: 16px;
    color: var(--ink-muted);
    font-style: italic;
    margin: 0;
    line-height: 1.4;
  }
  .detail-section {
    padding: 0 24px;
    margin-bottom: 28px;
  }
  .detail-section-title {
    font-family: var(--sans);
    font-size: 10px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--brass-deep);
    font-weight: 600;
    margin: 0 0 14px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .detail-section-title::after {
    content: '';
    flex: 1;
    height: 0.5px;
    background: var(--line);
  }

  .ingredient-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .ingredient-item {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 10px 0;
    border-bottom: 0.5px solid var(--line);
    font-size: 14px;
  }
  .ingredient-item:last-child { border-bottom: none; }
  .ingredient-name {
    font-family: var(--serif);
    font-size: 16px;
    color: var(--ink);
  }
  .ingredient-amount {
    font-family: var(--sans);
    font-size: 12px;
    color: var(--ink-muted);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
    font-weight: 500;
  }
  .ingredient-missing .ingredient-name {
    color: var(--ink-faint);
    text-decoration: line-through;
    text-decoration-color: rgba(28, 19, 13, 0.2);
  }
  .ingredient-missing .ingredient-amount { color: var(--ink-faint); }
  .ingredient-missing .ingredient-name::before {
    content: '—';
    margin-right: 8px;
    color: var(--ink-faint);
    text-decoration: none;
    display: inline-block;
  }

  .method-list {
    list-style: none;
    counter-reset: step;
    padding: 0;
    margin: 0;
  }
  .method-item {
    counter-increment: step;
    padding: 10px 0 12px 40px;
    position: relative;
    font-family: var(--serif);
    font-size: 15px;
    color: var(--ink-soft);
    line-height: 1.55;
  }
  .method-item::before {
    content: counter(step);
    position: absolute;
    left: 0;
    top: 8px;
    width: 26px;
    height: 26px;
    border: 0.5px solid var(--line-brass);
    background: var(--brass-soft);
    border-radius: 50%;
    color: var(--brass-deep);
    font-family: var(--display);
    font-size: 13px;
    font-weight: 600;
    font-style: italic;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .prose {
    font-family: var(--serif);
    font-size: 16px;
    line-height: 1.6;
    color: var(--ink-soft);
  }
  .prose p { margin: 0 0 14px; }
  .prose p:last-child { margin-bottom: 0; }
  .prose em {
    color: var(--oxblood);
    font-style: italic;
    font-weight: 500;
  }

  .pull-quote {
    font-family: var(--display);
    font-style: italic;
    font-size: 19px;
    font-weight: 500;
    color: var(--oxblood);
    border-left: 1.5px solid var(--brass);
    padding: 6px 0 6px 18px;
    margin: 18px 0;
    line-height: 1.4;
    letter-spacing: -0.005em;
  }

  /* RATING */
  .rating-zone {
    background: var(--paper-card);
    border: 0.5px solid var(--line);
    border-radius: var(--r-md);
    padding: 20px;
    margin: 0 24px;
    box-shadow: var(--shadow-sm);
  }
  .rating-stars {
    display: flex;
    gap: 4px;
    margin: 8px 0 18px;
  }
  .star {
    width: 30px; height: 30px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    color: var(--line-strong);
    transition: color 0.15s, transform 0.15s;
  }
  .star.active { color: var(--brass); }
  .star:active { transform: scale(0.85); }
  .star svg { width: 100%; height: 100%; }

  .rating-label {
    font-family: var(--sans);
    font-size: 9px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--ink-muted);
    font-weight: 600;
  }
  .rating-textarea {
    width: 100%;
    background: var(--paper);
    border: 0.5px solid var(--line-strong);
    border-radius: var(--r-sm);
    padding: 10px 12px;
    font-family: var(--serif);
    font-size: 15px;
    color: var(--ink);
    resize: vertical;
    min-height: 70px;
    margin-top: 8px;
    line-height: 1.5;
  }
  .rating-textarea:focus { outline: none; border-color: var(--steel); }

  .rating-save {
    background: var(--ink);
    color: var(--paper);
    border: none;
    padding: 12px 20px;
    border-radius: var(--r-sm);
    font-family: var(--display);
    font-size: 15px;
    font-style: italic;
    font-weight: 500;
    letter-spacing: 0;
    text-transform: none;
    cursor: pointer;
    margin-top: 14px;
    width: 100%;
    transition: background 0.15s;
  }
  .rating-save:active { background: var(--ink-soft); }

  .rating-saved-msg {
    font-family: var(--serif);
    font-style: italic;
    font-size: 14px;
    color: var(--brass-deep);
    margin-top: 12px;
    text-align: center;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .rating-saved-msg.show { opacity: 1; }

  /* INVENTORY */
  .inventory-categories {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .inv-category {
    background: var(--paper-card);
    border: 0.5px solid var(--line);
    border-radius: var(--r-md);
    padding: 14px 16px;
    box-shadow: var(--shadow-sm);
  }
  .inv-cat-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
  }
  .inv-cat-name {
    font-family: var(--display);
    font-size: 17px;
    font-weight: 600;
    color: var(--ink);
    letter-spacing: -0.005em;
  }
  .inv-cat-count {
    font-family: var(--sans);
    font-size: 10px;
    color: var(--ink-faint);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 500;
  }
  .inv-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 12px;
    min-height: 4px;
  }
  .inv-chip {
    display: inline-flex;
    align-items: stretch;
    background: var(--paper-deep);
    color: var(--ink);
    padding: 0;
    overflow: hidden;
    border-radius: 999px;
    border: 0.5px solid transparent;
    transition: all 0.15s;
  }
  .inv-chip:hover { border-color: var(--line-strong); }
  .inv-input-row {
    display: flex;
    gap: 6px;
  }
  .inv-input {
    flex: 1;
    background: var(--paper);
    border: 0.5px solid var(--line-strong);
    border-radius: var(--r-sm);
    padding: 8px 11px;
    font-family: var(--sans);
    font-size: 13px;
    color: var(--ink);
  }
  .inv-input:focus { outline: none; border-color: var(--steel); }
  .inv-add-btn {
    background: var(--ink);
    color: var(--paper);
    border: none;
    padding: 0 16px;
    border-radius: var(--r-sm);
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    letter-spacing: 0.04em;
  }
  .inv-add-btn:active { background: var(--ink-soft); }

  /* JOURNAL */
  .journal-empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-muted);
  }
  .journal-empty-mark {
    font-family: var(--display);
    font-style: italic;
    font-size: 18px;
    color: var(--brass-deep);
    margin-bottom: 8px;
    font-weight: 500;
  }
  .journal-empty-text {
    font-family: var(--serif);
    font-size: 14px;
    line-height: 1.6;
    max-width: 280px;
    margin: 0 auto;
    font-style: italic;
  }
  .journal-entry {
    background: var(--paper-card);
    border: 0.5px solid var(--line);
    border-radius: var(--r-md);
    padding: 14px 16px;
    margin-bottom: 10px;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: box-shadow 0.15s;
  }
  .journal-entry:hover { box-shadow: var(--shadow-md); }
  .journal-entry:active { background: var(--paper-deep); }
  .journal-entry-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
    gap: 10px;
  }
  .journal-entry-name {
    font-family: var(--display);
    font-size: 19px;
    font-weight: 600;
    color: var(--ink);
    letter-spacing: -0.005em;
  }
  .journal-entry-date {
    font-family: var(--sans);
    font-size: 10px;
    color: var(--ink-faint);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 500;
    flex-shrink: 0;
  }
  .journal-entry-stars {
    color: var(--brass);
    font-size: 13px;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .journal-entry-notes {
    font-family: var(--serif);
    font-size: 14px;
    color: var(--ink-muted);
    line-height: 1.5;
    font-style: italic;
  }
  .journal-entry-bottles {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 6px;
    margin: 6px 0 8px;
  }
  .journal-entry-bottles-label {
    font-family: var(--sans);
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 600;
    margin-right: 2px;
  }
  .journal-entry-bottle-pill {
    background: var(--brass-soft);
    color: var(--brass-deep);
    border: 0.5px solid var(--line-brass);
    border-radius: 999px;
    padding: 2px 9px;
    font-family: var(--display);
    font-size: 12px;
    font-style: italic;
    font-weight: 600;
    letter-spacing: -0.005em;
  }

  /* MAKING HISTORY — list of every time you've made a particular cocktail */
  .best-version {
    display: inline-flex;
    flex-direction: column;
    gap: 2px;
    padding: 12px 16px;
    background: linear-gradient(135deg, var(--brass-soft), transparent);
    border-left: 2px solid var(--brass);
    border-radius: 0 var(--r-sm) var(--r-sm) 0;
    margin: 0 0 16px;
  }
  .best-version-label {
    font-family: var(--sans);
    font-size: 9px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--brass-deep);
    font-weight: 600;
  }
  .best-version-stars {
    font-family: var(--display);
    font-size: 16px;
    color: var(--brass);
    letter-spacing: 2px;
  }
  .best-version-bottles {
    font-family: var(--display);
    font-style: italic;
    font-size: 15px;
    color: var(--ink);
    font-weight: 600;
    letter-spacing: -0.005em;
  }

  .making-history {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .making-row {
    background: var(--paper);
    border: 0.5px solid var(--line);
    border-radius: var(--r-sm);
    padding: 12px 38px 12px 14px;
    position: relative;
  }
  .making-row-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }
  .making-row-stars {
    color: var(--brass);
    letter-spacing: 1.5px;
    font-size: 13px;
  }
  .making-row-date {
    font-family: var(--serif);
    font-size: 12px;
    font-style: italic;
    color: var(--ink-faint);
  }
  .making-row-bottles {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin: 4px 0;
  }
  .making-row-bottle-pill {
    background: var(--paper-deep);
    color: var(--ink-soft);
    border-radius: 999px;
    padding: 2px 8px;
    font-family: var(--serif);
    font-size: 11px;
  }
  .making-row-notes {
    font-family: var(--serif);
    font-style: italic;
    font-size: 13px;
    color: var(--ink-muted);
    line-height: 1.45;
    margin-top: 4px;
  }
  .making-row-delete {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: transparent;
    color: var(--ink-faint);
    border: none;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    transition: all 0.15s;
  }
  .making-row-delete:hover {
    background: var(--oxblood-soft);
    color: var(--oxblood);
  }

  /* LEARN */
  .learn-family {
    background: var(--paper-card);
    border: 0.5px solid var(--line);
    border-radius: var(--r-md);
    padding: 18px 20px;
    margin-bottom: 12px;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: box-shadow 0.15s;
  }
  .learn-family:hover { box-shadow: var(--shadow-md); }
  .learn-family:active { background: var(--paper-deep); }
  .learn-family-name {
    font-family: var(--display);
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 4px;
    letter-spacing: -0.005em;
  }
  .learn-family-tag {
    font-family: var(--serif);
    font-style: italic;
    font-size: 14px;
    color: var(--brass-deep);
    margin: 0 0 10px;
  }
  .learn-family-desc {
    font-family: var(--serif);
    font-size: 14px;
    color: var(--ink-muted);
    line-height: 1.5;
    margin: 0 0 12px;
  }
  .learn-family-members {
    font-family: var(--sans);
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--ink-soft);
    text-transform: uppercase;
    font-weight: 500;
  }

  /* FILTER */
  .filter-row {
    display: flex;
    gap: 6px;
    margin-bottom: 20px;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    padding: 2px 0;
  }
  .filter-row::-webkit-scrollbar { display: none; }
  .filter-pill {
    flex-shrink: 0;
    background: transparent;
    border: 0.5px solid var(--line-strong);
    color: var(--ink-muted);
    padding: 6px 14px;
    border-radius: 999px;
    font-family: var(--sans);
    font-size: 12px;
    cursor: pointer;
    letter-spacing: 0.02em;
    white-space: nowrap;
    font-weight: 500;
    transition: all 0.15s;
  }
  .filter-pill:hover { border-color: var(--ink); color: var(--ink); }
  .filter-pill.active {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  /* TAB BAR */
  .tabbar {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    background: var(--paper);
    border-top: 0.5px solid var(--line-strong);
    display: flex;
    z-index: 20;
    padding-bottom: env(safe-area-inset-bottom);
    box-shadow: 0 -1px 12px rgba(28, 19, 13, 0.04);
  }
  .tab {
    flex: 1;
    background: none;
    border: none;
    padding: 10px 2px 12px;
    cursor: pointer;
    color: var(--ink-faint);
    font-family: var(--sans);
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 600;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    position: relative;
    transition: color 0.15s;
  }
  .tab.active { color: var(--ink); }
  .tab.active::after {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 20px;
    height: 1.5px;
    background: var(--brass);
  }
  .tab-icon {
    width: 19px;
    height: 19px;
  }

  /* HOST / NIGHT */
  .host-setup {
    background: var(--paper-card);
    border: 0.5px solid var(--line);
    border-radius: var(--r-md);
    padding: 22px;
    margin-bottom: 18px;
    box-shadow: var(--shadow-sm);
  }
  .host-field {
    margin-bottom: 22px;
  }
  .host-field:last-child { margin-bottom: 0; }
  .host-field-label {
    display: block;
    font-family: var(--sans);
    font-size: 9px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--ink-muted);
    font-weight: 600;
    margin-bottom: 10px;
  }
  .host-stepper {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .stepper-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 0.5px solid var(--line-strong);
    background: var(--paper);
    color: var(--ink);
    font-size: 18px;
    font-family: var(--display);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    transition: all 0.15s;
  }
  .stepper-btn:hover { border-color: var(--ink); }
  .stepper-btn:active { background: var(--paper-deep); transform: scale(0.92); }
  .stepper-btn:disabled { opacity: 0.25; cursor: not-allowed; }
  .stepper-value {
    font-family: var(--display);
    font-size: 32px;
    font-weight: 600;
    min-width: 38px;
    text-align: center;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    letter-spacing: -0.02em;
  }
  .stepper-suffix {
    font-family: var(--serif);
    font-style: italic;
    font-size: 14px;
    color: var(--ink-muted);
  }
  .vibe-row {
    display: flex;
    gap: 6px;
  }
  .vibe-pill {
    flex: 1;
    background: var(--paper);
    border: 0.5px solid var(--line-strong);
    color: var(--ink-muted);
    padding: 11px 6px;
    border-radius: var(--r-md);
    font-family: var(--sans);
    font-size: 12px;
    cursor: pointer;
    text-align: center;
    line-height: 1.3;
    font-weight: 500;
    transition: all 0.15s;
  }
  .vibe-pill:hover { border-color: var(--ink); color: var(--ink); }
  .vibe-pill.active {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }
  .citrus-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .citrus-pill {
    background: var(--paper);
    border: 0.5px solid var(--line-strong);
    color: var(--ink-muted);
    padding: 7px 14px;
    border-radius: 999px;
    font-family: var(--sans);
    font-size: 12px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-weight: 500;
    transition: all 0.15s;
  }
  .citrus-pill:hover { border-color: var(--ink); color: var(--ink); }
  .citrus-pill.active {
    background: var(--brass-soft);
    color: var(--brass-deep);
    border-color: var(--line-brass);
  }
  .host-curate-btn {
    width: 100%;
    background: var(--ink);
    color: var(--paper);
    border: none;
    padding: 14px;
    border-radius: var(--r-md);
    font-family: var(--display);
    font-size: 17px;
    font-style: italic;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
    letter-spacing: -0.005em;
    transition: background 0.15s;
  }
  .host-curate-btn:hover { background: var(--ink-soft); }
  .host-curate-btn:active { transform: scale(0.99); }

  /* Curated menu */
  .menu-meta {
    background: var(--paper-card);
    border: 0.5px solid var(--line);
    border-radius: var(--r-md);
    padding: 14px 18px;
    margin-bottom: 18px;
    font-family: var(--serif);
    font-size: 14px;
    color: var(--ink-muted);
    line-height: 1.5;
    font-style: italic;
    box-shadow: var(--shadow-sm);
  }
  .menu-meta strong {
    color: var(--ink);
    font-weight: 600;
    font-style: normal;
  }

  .menu-warnings {
    background: var(--oxblood-soft);
    border-left: 1.5px solid var(--oxblood);
    padding: 12px 16px;
    margin-bottom: 18px;
    border-radius: 0 var(--r-sm) var(--r-sm) 0;
    font-family: var(--serif);
    font-size: 13px;
    color: var(--oxblood-deep);
    line-height: 1.5;
  }
  .menu-warning-title {
    font-family: var(--sans);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    font-size: 9px;
    margin-bottom: 6px;
  }
  .menu-warnings strong { font-weight: 600; }

  .menu-course {
    display: flex;
    gap: 16px;
    padding: 18px 0;
    border-bottom: 0.5px solid var(--line);
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .menu-course:hover { opacity: 0.85; }
  .menu-course:last-of-type { border-bottom: none; }
  .menu-course-num {
    font-family: var(--display);
    font-size: 36px;
    font-style: italic;
    font-weight: 600;
    color: var(--brass);
    line-height: 1;
    min-width: 36px;
    padding-top: 2px;
    letter-spacing: -0.02em;
  }
  .menu-course-body { flex: 1; min-width: 0; }
  .menu-course-name {
    font-family: var(--display);
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 3px;
    line-height: 1.1;
    letter-spacing: -0.005em;
  }
  .menu-course-meta {
    font-family: var(--sans);
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--brass-deep);
    margin-bottom: 8px;
    font-weight: 600;
  }
  .menu-course-tagline {
    font-family: var(--serif);
    font-style: italic;
    font-size: 14px;
    color: var(--ink-muted);
    line-height: 1.45;
    margin-bottom: 10px;
  }
  .menu-course-rationale {
    font-family: var(--serif);
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.5;
    border-top: 0.5px solid var(--line);
    padding-top: 10px;
    font-style: italic;
  }
  .menu-actions {
    display: flex;
    gap: 8px;
    margin-top: 26px;
  }
  .menu-action-primary {
    flex: 2;
    background: var(--ink);
    color: var(--paper);
    border: none;
    padding: 14px;
    border-radius: var(--r-md);
    font-family: var(--display);
    font-size: 17px;
    font-style: italic;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: -0.005em;
    transition: background 0.15s;
  }
  .menu-action-primary:hover { background: var(--ink-soft); }
  .menu-action-secondary {
    flex: 1;
    background: transparent;
    color: var(--ink);
    border: 0.5px solid var(--line-strong);
    padding: 14px;
    border-radius: var(--r-md);
    font-family: var(--sans);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.15s;
  }
  .menu-action-secondary:hover { background: var(--paper-deep); border-color: var(--ink); }

  /* Walkthrough mode */
  .walkthrough {
    padding: 20px 20px 0;
  }
  .walk-progress {
    display: flex;
    gap: 4px;
    margin-bottom: 22px;
  }
  .walk-progress-pip {
    flex: 1;
    height: 2.5px;
    background: var(--line);
    border-radius: 1px;
    transition: background 0.3s;
  }
  .walk-progress-pip.done { background: var(--brass); }
  .walk-progress-pip.active { background: var(--oxblood); }
  .walk-position {
    font-family: var(--sans);
    font-size: 9px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 10px;
    font-weight: 600;
  }
  .walk-name {
    font-family: var(--display);
    font-size: 38px;
    font-weight: 600;
    font-style: italic;
    line-height: 1;
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }
  .walk-tagline {
    font-family: var(--serif);
    font-size: 16px;
    font-style: italic;
    color: var(--ink-muted);
    margin: 0 0 26px;
    line-height: 1.4;
  }
  .walk-section {
    margin-bottom: 26px;
  }
  .walk-section-title {
    font-family: var(--sans);
    font-size: 9px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--brass-deep);
    font-weight: 600;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 0.5px solid var(--line);
  }
  .walk-host-script {
    background: var(--brass-soft);
    border-left: 1.5px solid var(--brass);
    padding: 14px 18px;
    font-family: var(--serif);
    font-size: 16px;
    font-style: italic;
    line-height: 1.6;
    color: var(--ink-soft);
    margin-bottom: 8px;
    border-radius: 0 var(--r-sm) var(--r-sm) 0;
  }
  .walk-tasting-cue {
    font-family: var(--serif);
    font-size: 14px;
    color: var(--ink-muted);
    line-height: 1.55;
    padding: 0 4px;
    font-style: italic;
  }
  .walk-nav {
    display: flex;
    gap: 8px;
    margin: 28px 0 16px;
  }
  .walk-prev, .walk-next, .walk-finish {
    padding: 14px;
    border-radius: var(--r-md);
    border: none;
    font-family: var(--sans);
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .walk-prev {
    background: transparent;
    color: var(--ink);
    border: 0.5px solid var(--line-strong);
    flex: 1;
  }
  .walk-prev:hover:not(:disabled) { border-color: var(--ink); }
  .walk-prev:disabled { opacity: 0.25; }
  .walk-next, .walk-finish {
    background: var(--ink);
    color: var(--paper);
    flex: 2;
    font-family: var(--display);
    font-size: 15px;
    font-style: italic;
    text-transform: none;
    letter-spacing: -0.005em;
  }
  .walk-next:hover { background: var(--ink-soft); }
  .walk-finish { background: var(--oxblood); }
  .walk-finish:hover { background: var(--oxblood-deep); }
  .walk-exit {
    width: 100%;
    background: transparent;
    border: 0.5px solid var(--line);
    color: var(--ink-muted);
    padding: 9px;
    border-radius: var(--r-sm);
    font-family: var(--sans);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    margin-bottom: 16px;
    font-weight: 500;
    transition: all 0.15s;
  }
  .walk-exit:hover { color: var(--ink); border-color: var(--line-strong); }

  /* BOTTLE RECOMMENDATIONS */
  .bottle-rec-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .bottle-rec {
    background: var(--brass-soft);
    border: 0.5px solid var(--line-brass);
    border-radius: var(--r-md);
    padding: 14px 16px;
    transition: all 0.15s;
    position: relative;
  }
  .bottle-rec-clickable {
    cursor: pointer;
  }
  .bottle-rec-clickable:hover {
    background: var(--brass-soft);
    border-color: var(--brass);
    box-shadow: var(--shadow-sm);
  }
  .bottle-rec-clickable:active { transform: scale(0.99); }

  /* Tier-specific styling */
  .bottle-rec-best {
    background: var(--brass-soft);
    border-color: var(--brass);
  }
  .bottle-rec-good {
    background: var(--paper-card);
    border-color: var(--line-brass);
  }
  .bottle-rec-profile {
    background: var(--paper-card);
    border-color: var(--line);
  }
  .bottle-rec-float {
    background: var(--steel-soft);
    border-color: var(--steel-muted);
  }

  .bottle-rec-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }
  .bottle-rec-name {
    font-family: var(--display);
    font-size: 17px;
    font-weight: 600;
    color: var(--ink);
    letter-spacing: -0.005em;
  }
  .bottle-rec-tier {
    flex-shrink: 0;
    font-family: var(--sans);
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: var(--r-sm);
  }
  .bottle-rec-tier-best {
    background: var(--brass);
    color: var(--paper);
  }
  .bottle-rec-tier-good {
    background: var(--paper);
    color: var(--brass-deep);
    border: 0.5px solid var(--line-brass);
  }
  .bottle-rec-tier-float {
    background: var(--steel);
    color: var(--paper);
  }
  .bottle-rec-style {
    font-family: var(--serif);
    font-style: italic;
    font-size: 13px;
    color: var(--ink-muted);
    margin-bottom: 8px;
  }
  .bottle-rec-note {
    font-family: var(--serif);
    font-size: 14px;
    color: var(--ink-soft);
    line-height: 1.45;
    margin-top: 4px;
    margin-bottom: 6px;
  }
  .bottle-rec-tap {
    font-family: var(--sans);
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--brass-deep);
    font-weight: 600;
  }

  /* BOTTLE AVOID list — bottles in user's bar that aren't right for this drink */
  .bottle-avoid-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .bottle-avoid {
    background: var(--oxblood-soft);
    border-left: 2px solid var(--oxblood);
    border-radius: 0 var(--r-sm) var(--r-sm) 0;
    padding: 10px 14px;
  }
  .bottle-avoid-name {
    font-family: var(--display);
    font-size: 15px;
    font-weight: 600;
    color: var(--oxblood-deep);
    letter-spacing: -0.005em;
    margin-bottom: 2px;
  }
  .bottle-avoid-note {
    font-family: var(--serif);
    font-size: 13px;
    font-style: italic;
    color: var(--ink-soft);
    line-height: 1.45;
  }

  /* BOTTLE PICKER — used in journal entry to record which bottles you reached for */
  .bottle-picker-hint {
    font-family: var(--serif);
    font-size: 13px;
    font-style: italic;
    color: var(--ink-muted);
    margin: 0 0 10px;
    line-height: 1.4;
  }
  .bottle-picker {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 16px;
  }
  .bottle-pick {
    background: var(--paper-deep);
    color: var(--ink-soft);
    border: 0.5px solid var(--line);
    border-radius: 999px;
    padding: 6px 12px;
    font-family: var(--serif);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .bottle-pick:hover { border-color: var(--ink-muted); }
  .bottle-pick.active {
    background: var(--brass-soft);
    color: var(--brass-deep);
    border-color: var(--brass);
    font-weight: 600;
  }

  /* "Last made with" pill on cocktail detail */
  .last-made-pill {
    display: inline-flex;
    flex-direction: column;
    gap: 2px;
    padding: 10px 14px;
    background: var(--brass-soft);
    border-left: 2px solid var(--brass);
    border-radius: 0 var(--r-sm) var(--r-sm) 0;
    margin: 0 0 18px;
    align-self: flex-start;
  }
  .last-made-label {
    font-family: var(--sans);
    font-size: 9px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--brass-deep);
    font-weight: 600;
  }
  .last-made-bottles {
    font-family: var(--display);
    font-style: italic;
    font-size: 16px;
    color: var(--ink);
    font-weight: 600;
    letter-spacing: -0.005em;
  }

  /* PERSONAL BOTTLE NOTES on spirit detail */
  .prose-eyebrow {
    font-family: var(--serif);
    font-size: 13px;
    font-style: italic;
    color: var(--ink-muted);
    margin: 0 0 10px;
    line-height: 1.45;
  }
  .bottle-note-textarea {
    width: 100%;
    min-height: 90px;
    padding: 12px 14px;
    background: var(--paper);
    border: 0.5px solid var(--line-strong);
    border-radius: var(--r-sm);
    font-family: var(--serif);
    font-size: 14px;
    color: var(--ink);
    line-height: 1.5;
    resize: vertical;
    box-sizing: border-box;
  }
  .bottle-note-textarea:focus {
    outline: none;
    border-color: var(--steel);
  }
  .bottle-note-actions {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 10px;
  }
  .bottle-note-save {
    background: var(--ink);
    color: var(--paper);
    border: none;
    padding: 9px 18px;
    border-radius: var(--r-sm);
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .bottle-note-save:active { background: var(--ink-soft); }
  .bottle-note-saved {
    font-family: var(--serif);
    font-size: 13px;
    font-style: italic;
    color: var(--brass-deep);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .bottle-note-saved.show { opacity: 1; }

  /* CITRUS TOGGLES IN BAR */
  /* CITRUS BLOCK — top of Bar tab, compact pill row */
  .citrus-block {
    background: var(--paper-card);
    border: 0.5px solid var(--line);
    border-radius: var(--r-md);
    padding: 14px 16px;
    margin-bottom: 22px;
    box-shadow: var(--shadow-sm);
  }
  .citrus-block-label {
    font-family: var(--sans);
    font-size: 9px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--ink-muted);
    font-weight: 600;
    margin-bottom: 10px;
  }
  .citrus-toggles {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .citrus-toggle {
    background: var(--paper);
    border: 0.5px solid var(--line-strong);
    border-radius: var(--r-md);
    padding: 9px 10px;
    cursor: pointer;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 7px;
    transition: all 0.18s ease;
    position: relative;
  }
  .citrus-toggle:hover {
    border-color: var(--ink-muted);
  }
  .citrus-toggle.active {
    background: var(--brass-soft);
    border-color: var(--brass);
  }
  .citrus-toggle-icon {
    font-size: 16px;
    line-height: 1;
    filter: saturate(0.6);
    opacity: 0.4;
    transition: opacity 0.2s, filter 0.2s;
  }
  .citrus-toggle.active .citrus-toggle-icon {
    opacity: 1;
    filter: saturate(1.1);
  }
  .citrus-toggle-name {
    font-family: var(--display);
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-muted);
    letter-spacing: -0.005em;
  }
  .citrus-toggle.active .citrus-toggle-name {
    color: var(--ink);
  }

  /* CURRICULUM PATHS */
  .path-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .path-card {
    background: var(--paper-card);
    border: 0.5px solid var(--line);
    border-radius: var(--r-md);
    padding: 18px 20px;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: box-shadow 0.15s, transform 0.15s;
    position: relative;
    overflow: hidden;
  }
  .path-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 2px;
    background: var(--steel);
  }
  .path-card.path-complete::before { background: var(--brass); }
  .path-card.path-actionable::before {
    background: linear-gradient(180deg, var(--brass) 0%, var(--steel) 100%);
    width: 3px;
  }
  .path-card:hover { box-shadow: var(--shadow-md); }
  .path-card:active { transform: scale(0.995); }
  .path-makeable-row {
    padding-top: 10px;
    border-top: 0.5px solid var(--line);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }
  .path-makeable-pill {
    background: var(--brass-soft);
    color: var(--brass-deep);
    border: 0.5px solid var(--line-brass);
    border-radius: 999px;
    padding: 3px 10px;
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
  }
  .path-next-name-inline {
    font-family: var(--serif);
    font-style: italic;
    font-size: 13px;
    color: var(--ink-muted);
  }
  .path-next-need {
    font-family: var(--sans);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-left: 6px;
    font-weight: 500;
  }
  .path-card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 14px;
  }
  .path-card-eyebrow {
    font-family: var(--sans);
    font-size: 9px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--steel-deep);
    font-weight: 600;
    margin-bottom: 4px;
  }
  .path-complete .path-card-eyebrow { color: var(--brass-deep); }
  .path-card-name {
    font-family: var(--display);
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 4px;
    line-height: 1.1;
    letter-spacing: -0.005em;
  }
  .path-card-subtitle {
    font-family: var(--serif);
    font-style: italic;
    font-size: 14px;
    color: var(--ink-muted);
    margin: 0;
    line-height: 1.4;
  }
  .path-badge {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--brass);
    color: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 600;

// Find brand picks relevant to the user's actual inventory for a given cocktail.
// Returns { recommended: [{name, note, tier}], avoid: [{name, note}] }
function brandPicksForUser(cocktailId) {
  const picks = BRAND_PICKS[cocktailId];
  if (!picks) return null;
  const inv = flatInventory();

  const findMatching = (rules, tier) => {
    const found = [];
    (rules || []).forEach(rule => {
      // Find inventory items that match this rule
      const matches = inv.filter(item =>
        rule.match.some(m => item.includes(m.toLowerCase()))
      );
      // Also try the original-cased inventory list for display
      const displayMatches = [];
      Object.entries(state.inventory).forEach(([key, val]) => {
        if (key === 'citrus') return;
        if (Array.isArray(val)) {
          val.forEach(item => {
            const lower = item.toLowerCase();
            if (rule.match.some(m => lower.includes(m.toLowerCase()))) {
              displayMatches.push(item);
            }
          });
        }
      });
      displayMatches.forEach(item => {
        // Avoid duplicates if multiple rules match the same item
        if (!found.find(f => f.name === item)) {
          found.push({ name: item, note: rule.note, tier });
        }
      });
    });
    return found;
  };

  return {
    recommended: [
      ...findMatching(picks.best, 'best'),
      ...findMatching(picks.good, 'good')
    ],
    float: findMatching(picks.float, 'float'),
    avoid: findMatching(picks.avoid, 'avoid')
  };
}

function loadInventory() {
  try {
    const raw = localStorage.getItem(STORAGE.inventory);
    if (raw) {
      const parsed = JSON.parse(raw);
      // Migration: add citrus field if missing from older saved data
      if (!parsed.citrus) {
        parsed.citrus = { lemons: false, limes: false, oranges: false };
        // If they had "Fresh Lemons" as an inventory item, infer the toggle
        const allItems = Object.values(parsed).flat();
        if (allItems.some(i => typeof i === 'string' && /lemon/i.test(i))) parsed.citrus.lemons = true;
        if (allItems.some(i => typeof i === 'string' && /lime/i.test(i))) parsed.citrus.limes = true;
        if (allItems.some(i => typeof i === 'string' && /orange/i.test(i))) parsed.citrus.oranges = true;
      }
      // Migration: remove obsolete "Fresh X" chips from any category — toggles own this now.
      // Match anything starting with "fresh " and citrus, or just "lemons"/"limes"/"oranges" alone.
      const isCitrusChip = (s) => {
        if (typeof s !== 'string') return false;
        const t = s.trim().toLowerCase();
        return /^(fresh\s+)?(lemons?|limes?|oranges?)$/.test(t);
      };
      Object.keys(parsed).forEach(key => {
        if (key === 'citrus') return;
        if (Array.isArray(parsed[key])) {
          parsed[key] = parsed[key].filter(item => !isCitrusChip(item));
        }
      });
      return parsed;
    }
  } catch (e) {}
  return JSON.parse(JSON.stringify(DEFAULT_INVENTORY));
}

function saveInventory() {
  try { localStorage.setItem(STORAGE.inventory, JSON.stringify(state.inventory)); } catch (e) {}
}

function loadJournal() {
  try {
    const raw = localStorage.getItem(STORAGE.journal);
    if (raw) {
      const parsed = JSON.parse(raw);
      // MIGRATION: Old format was {cocktailId: singleEntry}. New format is
      // {cocktailId: [entry1, entry2, ...]}. Detect old entries and wrap them.
      // Cocktail-night entries (with isNight: true) keep their old shape.
      Object.keys(parsed).forEach(key => {
        const v = parsed[key];
        if (v && !Array.isArray(v) && !v.isNight && v.rating !== undefined) {
          // Migrate single entry → array with one entry, generate an id
          const migrated = {
            ...v,
            entryId: v.entryId || (v.firstMade || new Date().toISOString()) + '|' + key,
            madeAt: v.lastMade || v.firstMade || new Date().toISOString()
          };
          parsed[key] = [migrated];
        }
      });
      return parsed;
    }
  } catch (e) {}
  return {};
}

function saveJournal() {
  try {
    localStorage.setItem(STORAGE.journal, JSON.stringify(state.journal));
  } catch (e) {
    if (e.name === 'QuotaExceededError' || e.code === 22 || e.code === 1014) {
      alert('Storage is full. Try removing some old photos from the journal.');
    }
  }
}

// ============================================================================
// JOURNAL HELPERS — for the new per-making architecture
// ============================================================================

// Returns all entries for a cocktail (or empty array)
function entriesFor(cocktailId) {
  const entry = state.journal[cocktailId];
  if (!entry) return [];
  if (Array.isArray(entry)) return entry;
  // Defensive — if somehow an unmigrated single entry slipped through
  if (entry.isNight) return []; // host-night entries don't belong in cocktail history
  return [entry];
}

// Returns true if the user has rated this cocktail at least once
function isCocktailMade(cocktailId) {
  return entriesFor(cocktailId).some(e => e.rating);
}

// Highest-rated entry for a cocktail (used in "your best version" callouts)
function bestEntryFor(cocktailId) {
  const entries = entriesFor(cocktailId);
  if (entries.length === 0) return null;
  return entries.reduce((best, e) => (e.rating > (best?.rating || 0) ? e : best), null);
}

// Most recent entry for a cocktail
function latestEntryFor(cocktailId) {
  const entries = entriesFor(cocktailId);
  if (entries.length === 0) return null;
  return [...entries].sort((a, b) => new Date(b.madeAt || 0) - new Date(a.madeAt || 0))[0];
}

// Add a new making to the journal (appends, never overwrites)
function addJournalEntry(cocktailId, cocktailName, entry) {
  if (!state.journal[cocktailId]) state.journal[cocktailId] = [];
  if (!Array.isArray(state.journal[cocktailId])) {
    // safety: convert legacy single object to array
    const old = state.journal[cocktailId];
    state.journal[cocktailId] = old.isNight ? [] : [old];
  }
  const newEntry = {
    entryId: new Date().toISOString() + '|' + cocktailId + '|' + Math.random().toString(36).slice(2, 7),
    cocktailId,
    cocktailName,
    madeAt: new Date().toISOString(),
    ...entry
  };
  state.journal[cocktailId].push(newEntry);
  saveJournal();
  return newEntry;
}

// Remove a single entry by id
function removeJournalEntry(cocktailId, entryId) {
  const entries = entriesFor(cocktailId);
  const filtered = entries.filter(e => e.entryId !== entryId);
  if (filtered.length === 0) {
    delete state.journal[cocktailId];
  } else {
    state.journal[cocktailId] = filtered;
  }
  saveJournal();
}

function loadBottleNotes() {
  try {
    const raw = localStorage.getItem(STORAGE.bottleNotes);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return {};
}

function saveBottleNotes() {

  } catch (e) {}
}

// ============================================================================
// INVENTORY MATCHING
// ============================================================================

function flatInventory() {
  const all = [];
  Object.entries(state.inventory).forEach(([key, val]) => {
    if (key === 'citrus') return; // handled separately below
    if (Array.isArray(val)) val.forEach(item => all.push(item.toLowerCase()));
  });
  // Add citrus toggle state as virtual inventory items
  const c = state.inventory.citrus || {};
  if (c.lemons) all.push('lemon','lemons','fresh lemon');
  if (c.limes) all.push('lime','limes','fresh lime');
  if (c.oranges) all.push('orange','oranges','fresh orange');
  return all;
}

function ingredientMatches(ing, inv) {
  if (!ing.match) return false;
  return ing.match.some(term => inv.some(item => item.includes(term.toLowerCase())));
}

function cocktailStatus(cocktail) {
  const inv = flatInventory();
  let have = 0, need = 0, optional = 0, optHave = 0;
  cocktail.ingredients.forEach(ing => {
    const matches = ingredientMatches(ing, inv);
    if (ing.optional) {
      optional++;
      if (matches) optHave++;
    } else {
      need++;
      if (matches) have++;
    }
  });
  return {
    have, need, optional, optHave,
    makeable: have === need,
    missing: cocktail.ingredients.filter(i => !i.optional && !ingredientMatches(i, inv))
  };
}

// For each cocktail not currently makeable, figure out what's missing.
// Then count, across all cocktails, how often each missing ingredient appears.
// This gives us a ranked "buy these next" list.
function unlockAnalysis() {
  const ingredientCounts = {}; // canonical name -> { count, unlocks: [...cocktail names], example: ingredient name }
  const inv = flatInventory();

  COCKTAILS.forEach(c => {
    const status = cocktailStatus(c);
    if (status.makeable) return; // already covered

    // If a cocktail is missing exactly ONE ingredient, that's a high-value unlock
    // If missing 2+, still useful but lower priority
    const missingCount = status.missing.length;

    status.missing.forEach(ing => {
      // Use a canonical key based on the first match term, so "Sweet vermouth" entries cluster
      const key = (ing.match && ing.match[0]) ? ing.match[0] : ing.name.toLowerCase();
      if (!ingredientCounts[key]) {
        ingredientCounts[key] = {
          name: ing.name.replace(/\s*\([^)]*\)\s*$/, ''), // strip trailing parens
          count: 0,
          oneAwayCount: 0,
          unlocks: [],
          oneAwayUnlocks: []
        };
      }
      ingredientCounts[key].count++;
      ingredientCounts[key].unlocks.push(c.name);
      if (missingCount === 1) {
        ingredientCounts[key].oneAwayCount++;
        ingredientCounts[key].oneAwayUnlocks.push(c.name);
      }
    });
  });

  // Convert to array, score by: drinks unlocked outright (one-away) weighted 3x,
  // plus drinks brought closer (still-missing) weighted 1x.
  const ranked = Object.entries(ingredientCounts).map(([key, info]) => ({
    key,
    name: info.name,
    score: info.oneAwayCount * 3 + (info.count - info.oneAwayCount),
    unlocksImmediate: info.oneAwayCount,
    unlocksTotal: info.count,
    immediateNames: info.oneAwayUnlocks,
    totalNames: info.unlocks
  }));

  ranked.sort((a, b) => b.score - a.score);
  return ranked;
}

// ============================================================================
// TONIGHT'S PICK — opinionated single recommendation per day
// ============================================================================

function tonightsPick() {
  const now = new Date();
  const day = now.getDay(); // 0 = Sunday, 6 = Saturday
  const month = now.getMonth(); // 0 = Jan
  const dateStr = now.toISOString().slice(0, 10); // for stable per-day pick

  const makeable = COCKTAILS.filter(c => cocktailStatus(c).makeable);
  if (makeable.length === 0) return null;

  // Score each candidate.
  const scored = makeable.map(c => {
    let score = 0;
    const reasons = [];

    // SEASONALITY (heavy weight)
    if (month >= 5 && month <= 8) {
      // Summer (Jun-Sep): favor highballs and aperitifs
      if (c.family === 'highball') { score += 5; reasons.push('summer calls for something long and refreshing'); }
      if (c.family === 'aperitif') { score += 5; reasons.push('aperitivos are summer\'s native cocktails'); }
      if (c.family === 'sour') { score += 2; }
      if (c.family === 'after-dinner') { score -= 4; }
      if (c.family === 'stirred' && c.id !== 'negroni') { score -= 1; }
    } else if (month >= 9 && month <= 11) {
      // Fall (Oct-Dec): favor stirred and warming
      if (c.family === 'stirred') { score += 5; reasons.push('autumn wants a stirred drink — contemplative, warming'); }
      if (c.family === 'after-dinner') { score += 3; reasons.push('the season for richer drinks'); }
      if (c.family === 'highball') { score -= 2; }
      if (c.id === 'boulevardier') { score += 2; reasons.push('a Negroni is a summer drink; a Boulevardier is what you order in October'); }
    } else if (month <= 1) {
      // Winter (Jan-Feb): favor stirred, dark, after-dinner
      if (c.family === 'stirred') { score += 5; reasons.push('January wants something that warms from the inside'); }
      if (c.family === 'after-dinner') { score += 4; }
      if (c.family === 'highball' || c.family === 'aperitif') { score -= 3; }
    } else {
      // Spring (Mar-May): bright sours, lighter stirred
      if (c.family === 'sour') { score += 4; reasons.push('spring is when sours come back into rotation'); }
      if (c.family === 'aperitif') { score += 3; reasons.push('the days are getting longer — time for aperitivo culture'); }
      if (c.family === 'after-dinner') { score -= 2; }
    }

    // DAY OF WEEK
    if (day === 5 || day === 6) {
      // Friday/Saturday: more celebratory
      if (c.family === 'sour' || c.family === 'aperitif') { score += 2; }
      if (c.id === 'martini' || c.id === 'manhattan' || c.id === 'negroni') { score += 3; reasons.push('it\'s the weekend — time for a proper classic'); }
    } else if (day === 0) {
      // Sunday: contemplative
      if (c.family === 'stirred') { score += 2; reasons.push('Sunday wants a stirred drink — slow, sippable'); }
    } else if (day >= 1 && day <= 4) {
      // Weekday: lower-proof or simpler
      if (c.family === 'aperitif' || c.family === 'highball') { score += 2; }
      if (c.ingredients.filter(i => !i.optional).length <= 3) { score += 1; }
    }

    // RECENCY — penalize drinks made in the last 2 weeks
    const latest = latestEntryFor(c.id);
    if (latest?.madeAt) {
      const daysSince = (now - new Date(latest.madeAt)) / (1000 * 60 * 60 * 24);
      if (daysSince < 14) {
        score -= (14 - daysSince) * 0.3;
      }
    }

    // FAVORITES — gentle boost for liked drinks (use the highest-ever rating)
    const best = bestEntryFor(c.id);
    if (best?.rating >= 4) {
      score += 1;
      if (best.rating === 5) score += 0.5;
    }

    // NOVELTY — boost for drinks never made
    if (!latest) {
      score += 1.5;
      reasons.push('one you haven\'t tried yet from your library');
    }

    // STABILITY — date-seeded random nudge so the pick stays consistent within a day
    const seed = hashCode(dateStr + c.id) / 2147483647;
    score += seed * 0.6;

    return { cocktail: c, score, reasons };
  });

  scored.sort((a, b) => b.score - a.score);
  const top = scored[0];

  // Build a single sentence rationale from the top reasons
  const rationale = top.reasons.length > 0
    ? top.reasons[0].charAt(0).toUpperCase() + top.reasons[0].slice(1) + '.'
    : 'A solid pick from your shelf.';

  return {
    cocktail: top.cocktail,
    rationale,
    contextLabel: contextLabel(now)
  };
}

function hashCode(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) {
    h = ((h << 5) - h) + str.charCodeAt(i);
    h |= 0;
  }
  return Math.abs(h);
}

function contextLabel(date) {
  const dayName = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][date.getDay()];
  const monthName = ['January','February','March','April','May','June','July','August','September','October','November','December'][date.getMonth()];
  return `${dayName} · ${monthName} ${date.getDate()}`;
}

// ============================================================================
// SUBSTITUTIONS — what swaps work for what's missing
// ============================================================================

function findSubstitutions(cocktail) {
  // Returns array of { ingredient, options: [{use, available, note}] }
  const inv = flatInventory();
  const result = [];

  cocktail.ingredients.forEach(ing => {
    if (ing.optional) return;
    const have = ingredientMatches(ing, inv);
    if (have) return; // not missing

    // Try to find substitutions for any of the match terms
    const subs = [];
    (ing.match || []).forEach(term => {
      const subList = SUBSTITUTIONS[term];
      if (!subList) return;
      subList.forEach(sub => {
        const available = sub.match && sub.match.some(m => inv.some(i => i.includes(m.toLowerCase())));
        // Only include if not already in subs (de-dup)
        if (!subs.find(s => s.use === sub.use)) {
          subs.push({ use: sub.use, available, note: sub.note });
        }
      });
    });

    if (subs.length > 0) {
      // Sort: available first
      subs.sort((a, b) => (b.available ? 1 : 0) - (a.available ? 1 : 0));
      result.push({ ingredient: ing, options: subs });
    } else {
      result.push({ ingredient: ing, options: [] });
    }
  });

  return result;
}

// Computes how close a cocktail is to makeable WITH known substitutions
function cocktailMakeableWithSubs(cocktail) {
  const inv = flatInventory();
  let canMake = true;
  const subUsed = [];

  cocktail.ingredients.forEach(ing => {
    if (ing.optional) return;
    if (ingredientMatches(ing, inv)) return;

    // Check substitutions
    let foundSub = null;
    (ing.match || []).forEach(term => {
      if (foundSub) return;
      const subList = SUBSTITUTIONS[term];
      if (!subList) return;
      subList.forEach(sub => {
        if (foundSub) return;
        if (sub.match && sub.match.some(m => inv.some(i => i.includes(m.toLowerCase())))) {
          foundSub = { for: ing.name, use: sub.use, note: sub.note };
        }
      });
    });

    if (foundSub) subUsed.push(foundSub);
    else canMake = false;
  });

  return { canMake, subUsed };
}

// ============================================================================
// SPIRIT PROFILE — knowledge cards for inventory items
// ============================================================================

function findSpiritProfile(itemName) {
  const lower = itemName.toLowerCase();
  for (const profile of SPIRIT_PROFILES) {
    if (profile.match.some(m => lower.includes(m.toLowerCase()))) {
      return profile;
    }
  }
  return null;
}

// For a given cocktail, find which of the user's specific bottles "shine"
// in this drink based on their spirit profiles' shines_in list.
// Returns inventory bottles that could plausibly be used as a "primary spirit" for this cocktail.
// Used for the "which bottle did you use?" picker on cocktail journal entries.
function candidateBottles(cocktail) {
  const candidates = [];
  // Collect all match-terms from all non-optional ingredients
  const allMatches = [];
  cocktail.ingredients.forEach(ing => {
    if (ing.optional) return;
    if (ing.match) ing.match.forEach(m => allMatches.push(m.toLowerCase()));
  });

  // Walk inventory in original case; collect items whose name contains any match term
  Object.entries(state.inventory).forEach(([key, val]) => {
    if (key === 'citrus') return;
    if (Array.isArray(val)) {
      val.forEach(item => {
        const lower = item.toLowerCase();
        if (allMatches.some(m => lower.includes(m))) {
          if (!candidates.includes(item)) candidates.push(item);
        }
      });
    }
  });

  return candidates;
}

function bottleRecommendations(cocktail) {
  // Combine two data sources:
  //   1. BRAND_PICKS — cocktail-specific best/good/avoid lists with per-bottle notes
  //   2. SPIRIT_PROFILES `shines_in` — bottle-specific cocktail recommendations
  // BRAND_PICKS data, when present, takes precedence and provides richer notes.

  const allItems = [];
  Object.entries(state.inventory).forEach(([key, val]) => {
    if (key === 'citrus') return;
    if (Array.isArray(val)) val.forEach(item => allItems.push(item));
  });

  const picks = brandPicksForUser(cocktail.id);
  const seen = new Set();
  const recommendations = [];

  // Tier 1: best brand picks from this cocktail's BRAND_PICKS
  if (picks?.recommended?.length > 0) {
    picks.recommended.forEach(p => {
      if (seen.has(p.name)) return;
      seen.add(p.name);
      const profile = findSpiritProfile(p.name);
      recommendations.push({
        bottle: p.name,
        profile: profile, // may be null if no detailed profile exists
        note: p.note,
        tier: p.tier // 'best' or 'good'
      });
    });
  }

  // Tier 2: profile-level "shines_in" matches we haven't already added
  allItems.forEach(item => {
    if (seen.has(item)) return;
    const profile = findSpiritProfile(item);
    if (!profile) return;
    if (profile.shines_in && profile.shines_in.includes(cocktail.id)) {
      recommendations.push({
        bottle: item,
        profile: profile,
        note: null, // no brand-pick note, just generally shines
        tier: 'profile'
      });
      seen.add(item);
    }
  });

  return recommendations;
}

// Returns warnings about "avoid" bottles in user's inventory for a given cocktail
function bottleAvoidances(cocktail) {
  const picks = brandPicksForUser(cocktail.id);
  return picks?.avoid || [];
}

// Returns float-specific bottle picks (e.g., for Penicillin's smoky float)
function bottleFloats(cocktail) {
  const picks = brandPicksForUser(cocktail.id);
  return picks?.float || [];
}

// ============================================================================
// RENDER
// ============================================================================

const view = document.getElementById('view');

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

function formatProse(text) {
  // markdown-lite: *italic*
  return escapeHtml(text).replace(/\*([^*]+)\*/g, '<em>$1</em>');
}

function render() {
  // tab bar active state
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === state.view);
  });

  if (state.selectedCocktail) {
    renderCocktailDetail(state.selectedCocktail);
    return;
  }
  if (state.selectedFamily) {
    renderFamilyDetail(state.selectedFamily);
    return;
  }
  if (state.selectedSpirit) {
    renderSpiritDetail(state.selectedSpirit);
    return;
  }
  if (state.selectedPath) {
    renderPathDetail(state.selectedPath);
    return;
  }

  if (state.view === 'discover') renderDiscover();
  else if (state.view === 'host') renderHost();
  else if (state.view === 'bar') renderBar();
  else if (state.view === 'journal') renderJournal();
  else if (state.view === 'learn') renderLearn();
  else if (state.view === 'settings') renderSettings();

  window.scrollTo(0, 0);
}

function renderDiscover() {
  const cocktails = COCKTAILS.map(c => ({ ...c, status: cocktailStatus(c) }));

  let filtered = cocktails;
  if (state.filter === 'makeable') filtered = cocktails.filter(c => c.status.makeable);
  else if (state.filter === 'rated') filtered = cocktails.filter(c => isCocktailMade(c.id));
  else if (state.filter !== 'all') filtered = cocktails.filter(c => c.family === state.filter);

  // sort: makeable first, then by name
  filtered.sort((a, b) => {
    if (a.status.makeable !== b.status.makeable) return b.status.makeable - a.status.makeable;
    return a.name.localeCompare(b.name);
  });

  const makeableCount = cocktails.filter(c => c.status.makeable).length;
  const pick = tonightsPick();

  view.innerHTML = `
    <div class="tab-content">
      ${pick ? `
        <div class="tonight-card" data-cocktail="${pick.cocktail.id}">
          <div class="tonight-eyebrow">
            <span class="tonight-label">Tonight's pick</span>
            <span class="tonight-context">${pick.contextLabel}</span>
          </div>
          <h2 class="tonight-name">${escapeHtml(pick.cocktail.name)}</h2>
          <p class="tonight-rationale">${escapeHtml(pick.rationale)}</p>
          <div class="tonight-cta">
            Make it tonight
            <span class="tonight-arrow">→</span>
          </div>
        </div>
      ` : ''}

      <div class="section-eyebrow">the library</div>
      <h2 class="section-title">${makeableCount} drinks ready</h2>
      <p class="section-sub">From a library of ${cocktails.length} cocktails. Brass-marked cards are fully makeable; others show what you'd need.</p>

      <div class="filter-row">
        <button class="filter-pill ${state.filter === 'all' ? 'active' : ''}" data-filter="all">All</button>
        <button class="filter-pill ${state.filter === 'makeable' ? 'active' : ''}" data-filter="makeable">Makeable</button>

    }, 900);
  });

// Compress an image File to a smaller base64 JPEG to save localStorage space.
// Targets ~800px max dimension and ~0.78 JPEG quality — good enough for app display.
function compressImage(file, callback) {
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const maxDim = 900;
      let { width, height } = img;
      if (width > height && width > maxDim) {
        height = Math.round((height * maxDim) / width);
        width = maxDim;
      } else if (height > maxDim) {
        width = Math.round((width * maxDim) / height);
        height = maxDim;
      }
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      callback(canvas.toDataURL('image/jpeg', 0.78));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

          if (lower.includes('lime')) state.inventory.citrus.limes = true;
          if (lower.includes('orange')) state.inventory.citrus.oranges = true;
        });
      }

      // Add real (non-citrus) entries normally
      realEntries.forEach(p => {
        if (!state.inventory[cat.id].includes(p)) state.inventory[cat.id].push(p);
      });

      saveInventory();
      input.value = '';
      render();
    };
    input.addEventListener('keydown', e => { if (e.key === 'Enter') add(); });
    btn.addEventListener('click', add);
  });
}

// HOST: CURATION LOGIC
// ============================================================================

// Combines real inventory (incl. citrus toggles) with any host-only overrides
// for the night ("I'll grab limes day-of even though I don't have them now").
function effectiveInventory() {
  // The host setup may further override citrus state for one-time "I'll grab some"
  // assumptions during curation. Real inventory citrus is persistent.
  const base = flatInventory();
  const hc = state.host.citrus || {};
  const have = new Set(base);
  if (hc.lemons && !have.has('lemon')) base.push('lemon','lemons');
  if (hc.limes && !have.has('lime')) base.push('lime','limes');
  if (hc.oranges && !have.has('orange')) base.push('orange','oranges');
  return base;
}

function effectiveStatus(cocktail) {
  const inv = effectiveInventory();
  let have = 0, need = 0;
  cocktail.ingredients.forEach(ing => {
    if (ing.optional) return;
    need++;
    if (ingredientMatches(ing, inv)) have++;
  });
  return { makeable: have === need, have, need };
}

// Family ordering for "light to heavy" pacing.
const FAMILY_ORDER = ['aperitif','highball','sour','stirred','after-dinner'];

function familyWeight(family) {
  const idx = FAMILY_ORDER.indexOf(family);
  return idx === -1 ? FAMILY_ORDER.length : idx;
}

// Curate a tasting menu of N drinks based on the configured vibe.
function curateMenu() {
  const candidates = COCKTAILS
    .map(c => ({ ...c, status: effectiveStatus(c) }))
    .filter(c => c.status.makeable);

  if (candidates.length === 0) return { drinks: [], reason: 'No drinks are currently makeable. Check your inventory or toggle the citrus assumptions.' };

  const want = Math.min(state.host.drinks, candidates.length);
  const vibe = state.host.vibe;

  // Pre-rank by "interest score" — boost rated favorites, novelty, family variety.
  const rated = state.journal;
  const candWithScore = candidates.map(c => {
    let score = 0;
    if (rated[c.id]?.rating) score += rated[c.id].rating; // favor liked drinks
    score += Math.random() * 0.5; // small randomness so re-curating gives variation
    return { ...c, _score: score };
  });

  let chosen = [];

  if (vibe === 'crowd') {
    // Crowd-pleasers: highballs and approachable sours, no Negronis or Sazeracs.
    const friendly = candWithScore.filter(c =>
      c.family === 'highball' || c.family === 'sour' || c.family === 'aperitif'
    );
    chosen = pickWithFamilyVariety(friendly, want);
    if (chosen.length < want) {
      const extras = pickWithFamilyVariety(
        candWithScore.filter(c => !chosen.includes(c)),
        want - chosen.length
      );
      chosen = chosen.concat(extras);
    }
  } else if (vibe === 'educational') {
    // Educational: pull one from each family to teach the patterns.
    const byFamily = {};
    FAMILY_ORDER.forEach(f => { byFamily[f] = candWithScore.filter(c => c.family === f); });
    // Pick one from each family in pacing order until we have enough
    for (const f of FAMILY_ORDER) {
      if (chosen.length >= want) break;
      const pool = byFamily[f].sort((a,b) => b._score - a._score);
      if (pool.length) chosen.push(pool[0]);
    }
    // Fill remaining with high-scoring non-duplicates
    if (chosen.length < want) {
      const remaining = candWithScore.filter(c => !chosen.includes(c)).sort((a,b) => b._score - a._score);
      chosen = chosen.concat(remaining.slice(0, want - chosen.length));
    }
  } else {
    // Mix: combine educational variety with crowd-pleasers
    chosen = pickWithFamilyVariety(candWithScore, want);
  }

  // Sort by family pacing: light to heavy.
  chosen.sort((a, b) => familyWeight(a.family) - familyWeight(b.family));

  // Generate per-course rationale.
  const drinks = chosen.map((c, idx) => ({
    cocktail: c,
    position: idx + 1,
    rationale: buildRationale(c, idx, chosen.length, vibe),
    hostScript: buildHostScript(c),
    tastingCue: buildTastingCue(c)
  }));

  return {
    drinks,
    summary: buildMenuSummary(drinks, vibe),
    warnings: computeInventoryWarnings(drinks)
  };
}

function pickWithFamilyVariety(pool, count) {
  // Prefer one drink per family before doubling up.
  const picked = [];
  const usedFamilies = new Set();
  const sorted = [...pool].sort((a,b) => b._score - a._score);
  // First pass: one per family
  for (const c of sorted) {
    if (picked.length >= count) break;
    if (!usedFamilies.has(c.family)) {
      picked.push(c);
      usedFamilies.add(c.family);
    }
  }
  // Second pass: fill remaining
  for (const c of sorted) {
    if (picked.length >= count) break;
    if (!picked.includes(c)) picked.push(c);
  }
  return picked;
}

function buildRationale(cocktail, index, total, vibe) {
  const isFirst = index === 0;
  const isLast = index === total - 1;

  if (isFirst) {
    if (cocktail.family === 'aperitif') return 'Opens the night light — Italian tradition says aperitivos whet the appetite without dulling it. Low-proof and refreshing.';
    if (cocktail.family === 'highball') return 'A relaxed opener. Easy to drink, easy to make, gets everyone settled.';
    if (cocktail.family === 'sour') return 'Bright and approachable. Citrus wakes the palate and signals the night has begun.';
    return 'Sets the tone — something everyone can sip while you find your rhythm.';
  }
  if (isLast) {
    if (cocktail.family === 'after-dinner') return 'A proper closer — rich, sweet, served late. Don\'t make a fourth.';
    if (cocktail.family === 'stirred') return 'The closer should be contemplative. Spirit-forward, sipped slowly, ends the night with intention.';
    return 'Where the night lands — sipped, not chugged.';
  }
  // Middle drinks
  if (cocktail.family === 'sour') return 'Mid-evening shift to something shaken — different technique to watch, brighter flavor to reset the palate.';
  if (cocktail.family === 'stirred') return 'Things go a little more serious. Stirred and spirit-forward — sipped, not gulped.';
  if (cocktail.family === 'highball') return 'A breather. Long, refreshing, gives everyone a moment.';
  return 'Builds on what came before, while shifting the mood.';
}

function buildHostScript(cocktail) {
  // Combine tagline (one-liner pitch), one fact from history (without copying it whole), and a tasting cue.
  // We'll use the tagline as the "what to say first" and pull a short hook from history.
  const opener = cocktail.tagline;
  // Generate a "hook fact" — short single-sentence factoid suitable to drop while making the drink.
  const hooks = HOST_HOOKS[cocktail.id] || cocktail.pullQuote || `From the ${familyLabel(cocktail.family).toLowerCase()} family — same template as countless other classics.`;
  return `"${opener}" — then while you make it, drop this: ${hooks}`;
}

function buildTastingCue(cocktail) {
  return TASTING_CUES[cocktail.id] || `Have everyone take their first sip together. Ask: what hits first? What lingers? In a ${familyLabel(cocktail.family).toLowerCase()}, you should notice ${familyTastingNote(cocktail.family)}.`;
}

function familyTastingNote(family) {
  switch (family) {
    case 'sour': return 'the bright tang of citrus first, then the warmth of the spirit underneath';
    case 'stirred': return 'no froth, no sharpness — the spirit comes through clean, polished by the dilution';
    case 'highball': return 'how the carbonation lifts the spirit and keeps the drink crisp';
    case 'aperitif': return 'the bitterness — it\'s designed to make you hungry, not drunk';
    case 'after-dinner': return 'the richness — this is dessert as much as it is a drink';
    default: return 'the balance between the elements';
  }
}

function buildMenuSummary(drinks, vibe) {
  const families = [...new Set(drinks.map(d => d.cocktail.family))];
  const familyText = families.map(f => familyLabel(f)).join(' → ');
  return `<strong>${drinks.length}-course tasting menu</strong> · ${familyText}`;
}

function computeInventoryWarnings(drinks) {
  // Estimate how many oz of each base spirit type we'll need.
  // Each drink × number of guests = total servings of that drink.
  const guests = state.host.guests;
  const usage = {}; // ingredient term -> oz needed

  drinks.forEach(d => {
    d.cocktail.ingredients.forEach(ing => {
      if (ing.optional) return;
      const ozMatch = (ing.amount || '').match(/([\d.]+)\s*oz/i);
      if (!ozMatch) return;
      const oz = parseFloat(ozMatch[1]);
      const key = ing.match && ing.match[0] ? ing.match[0] : ing.name;
      usage[key] = (usage[key] || 0) + (oz * guests);
    });
  });

  const warnings = [];
  Object.entries(usage).forEach(([key, oz]) => {
    // 750ml bottle ≈ 25.4 oz; flag if we need more than half a bottle
    if (oz >= 12) {
      warnings.push(`<strong>${key}</strong>: ~${Math.round(oz)} oz needed for ${guests} guests — over half a 750mL bottle.`);
    }
  });

  if (drinks.length === 0) return [];
  return warnings;
}
